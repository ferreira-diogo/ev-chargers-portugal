name: Build signed Android bundle

on:
  push:
    branches: [android-signed-candidate]
    paths: ["apps/chargevoy-android/**", ".github/workflows/android-release.yml"]
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name
        required: true
        default: "1.1.1"
      version_code:
        description: Positive integer version code
        required: true
        default: "3"

jobs:
  bundle:
    name: Build AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chargevoy-android
    env:
      ANDROID_INCLUDE_CATALOGUE: "1"
      ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.1.1' }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code || '3' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/chargevoy-android/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android interface dependencies
        run: npm ci
      - name: Validate Android interface and web isolation
        run: npm test
      - name: Sync Capacitor Android project
        run: npm run android:sync
      - name: Validate mobile and tablet interface
        run: npm install --no-save --package-lock=false playwright@1.58.2 && node browser-test.mjs
      - name: Upload interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-ui-evidence
          path: apps/chargevoy-android/qa/*.png
          if-no-files-found: ignore
      - name: Restore upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "ANDROID_KEYSTORE_PATH=$PWD/android/app/upload-keystore.jks" >> "$GITHUB_ENV"
      - name: Build signed Android App Bundle
        run: chmod +x android/gradlew && cd android && ./gradlew bundleRelease
      - name: Export release certificate
        run: keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab > qa/release-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chargevoy-${{ inputs.version_name || '1.1.1' }}.aab
          path: |
            apps/chargevoy-android/android/app/build/outputs/bundle/release/app-release.aab
            apps/chargevoy-android/qa/*.png
            apps/chargevoy-android/qa/release-certificate.txt
          if-no-files-found: error

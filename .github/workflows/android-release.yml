name: Build signed Android bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name
        required: true
        default: "1.0.0"
      version_code:
        description: Positive integer version code
        required: true
        default: "1"

jobs:
  bundle:
    name: Build AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ev-charge-portugal-github-ready
    env:
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ev-charge-portugal-github-ready/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install web dependencies
        run: npm ci
      - name: Sync Capacitor Android project
        run: npm run android:sync
      - name: Restore upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "ANDROID_KEYSTORE_PATH=$PWD/android/app/upload-keystore.jks" >> "$GITHUB_ENV"
      - name: Build signed Android App Bundle
        run: cd android && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: chargevoy-${{ inputs.version_name }}.aab
          path: ev-charge-portugal-github-ready/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

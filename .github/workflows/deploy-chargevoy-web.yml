name: Deploy ChargeVoy web

on:
  workflow_dispatch:
  schedule:
    # Publish the primary map catalogue daily, independently of D1 availability.
    - cron: "47 4 * * *"
  push:
    branches: [main, fix/d1-api-verification-retry]
    paths:
      - "ev-charge-portugal-github-ready/index.html"
      - "ev-charge-portugal-github-ready/assets/**"
      - "ev-charge-portugal-github-ready/manifest.webmanifest"
      - "ev-charge-portugal-github-ready/service-worker.js"
      - "ev-charge-portugal-github-ready/icon.svg"
      - "ev-charge-portugal-github-ready/scripts/build-web.mjs"
      - "ev-charge-portugal-github-ready/scripts/import-nap-datex.mjs"
      - "ev-charge-portugal-github-ready/wrangler.toml"
      - "ev-charge-portugal-github-ready/worker/**"
      - ".github/workflows/deploy-chargevoy-web.yml"

concurrency:
  group: chargevoy-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate Cloudflare configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$D1_DATABASE_NAME" || test -n "$D1_DATABASE_ID" || { echo "::error::Missing D1 database configuration"; exit 1; }
      - name: Identify legal page publication
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const {execFileSync}=require('node:child_process');
          let legalOnly=false;
          if(process.env.GITHUB_EVENT_NAME==='push' && /^[a-f0-9]{40}$/.test(process.env.BEFORE_SHA||'') && !/^0+$/.test(process.env.BEFORE_SHA)){
            const files=execFileSync('git',['diff','--name-only',process.env.BEFORE_SHA,process.env.GITHUB_SHA,'--','ev-charge-portugal-github-ready'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
            const allowed=new Set(['ev-charge-portugal-github-ready/privacy.html','ev-charge-portugal-github-ready/account-deletion.html','ev-charge-portugal-github-ready/scripts/build-web.mjs']);
            legalOnly=files.length>0 && files.every(file=>allowed.has(file));
          }
          console.log('legal_only='+legalOnly);
          NODE
      - name: Build web bundle
        working-directory: ev-charge-portugal-github-ready
        env:
          LEGAL_ONLY_DEPLOY: ${{ steps.scope.outputs.legal_only }}
        run: |
          npm install --no-audit --no-fund
          npm test
          if [ "$LEGAL_ONLY_DEPLOY" = true ]; then
            curl --fail --silent --show-error --retry 3 --max-time 45 'https://broken-mud-373e.zombid.workers.dev/assets/stations-snapshot.json' > assets/stations-snapshot.json
          else
            node scripts/import-nap-datex.mjs --web-snapshot
          fi
          node scripts/verify-static-snapshot.mjs
          npm run build:web
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Resolve D1 and availability KV
        working-directory: ev-charge-portugal-github-ready
        run: |
          set -euo pipefail
          if [ -n "$D1_DATABASE_ID" ]; then
            DB_ID="$D1_DATABASE_ID"
          else
            wrangler d1 info "$D1_DATABASE_NAME" --json > /tmp/d1-info.json
            DB_ID="$(node -e 'const fs=require("fs");const root=JSON.parse(fs.readFileSync("/tmp/d1-info.json","utf8"));const c=[root,root.result,root.database,root.result?.database].filter(Boolean);const d=c.find(x=>x.uuid||x.database_id||x.id);if(!d)process.exit(2);process.stdout.write(d.uuid||d.database_id||d.id||"")')"
          fi
          test -n "$DB_ID" || { echo "::error::D1 database ID could not be resolved"; exit 1; }
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error -H "$AUTH" "$API?per_page=100" > /tmp/kv.json
          KV_ID="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/kv.json","utf8"));const n=(x.result||[]).find(v=>v.title==="chargevoy-availability");if(!n?.id)process.exit(2);process.stdout.write(n.id)')"
          test -n "$KV_ID" || { echo "::error::KV namespace chargevoy-availability could not be resolved"; exit 1; }
          cp wrangler.toml wrangler-deploy.toml
          DB_ID="$DB_ID" KV_ID="$KV_ID" node - <<'NODE'
          const fs=require('fs'); const file='wrangler-deploy.toml';
          let text=fs.readFileSync(file,'utf8');
          text += `\n[[d1_databases]]\nbinding = "CHARGEVOY_DB"\ndatabase_name = "${process.env.D1_DATABASE_NAME || 'chargevoy-fallback'}"\ndatabase_id = "${process.env.DB_ID}"\n`;
          text += `\n[[kv_namespaces]]\nbinding = "AVAILABILITY_KV"\nid = "${process.env.KV_ID}"\n`;
          fs.writeFileSync(file,text);
          NODE
          grep -q '^database_id = "' wrangler-deploy.toml
          grep -q '^id = "' wrangler-deploy.toml
          ! grep -q 'PLACEHOLDER' wrangler-deploy.toml
      - name: Save the exact previous Worker version and catalogue
        id: backup
        working-directory: ev-charge-portugal-github-ready
        run: |
          set -euo pipefail
          mkdir -p tmp/web-rollback
          wrangler deployments list --config wrangler-deploy.toml --json > tmp/web-rollback/deployments.json
          version="$(node -e 'const x=require("./tmp/web-rollback/deployments.json");const d=x.sort((a,b)=>a.created_on.localeCompare(b.created_on)).at(-1);if(d?.versions?.length!==1||d.versions[0].percentage!==100)throw new Error("Expected one active Worker version");process.stdout.write(d.versions[0].version_id)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$version" > tmp/web-rollback/worker-version.txt
          git rev-parse HEAD > tmp/web-rollback/new-commit.txt
          curl --fail --silent --show-error --retry 3 --max-time 45 'https://broken-mud-373e.zombid.workers.dev/assets/stations-snapshot.json' > tmp/web-rollback/stations-snapshot.json
          node - <<'NODE'
          const fs=require('fs');
          const previous=JSON.parse(fs.readFileSync('tmp/web-rollback/stations-snapshot.json','utf8'));
          const next=JSON.parse(fs.readFileSync('assets/stations-snapshot.json','utf8'));
          if (previous.stations?.length<8000 || previous.connectors?.length<15000 ||
              next.stations.length<previous.stations.length*0.95 || next.connectors.length<previous.connectors.length*0.95)
            throw new Error('Refusing to replace the map with a catalogue that lost more than 5% of its records');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: catalogue-web-rollback-${{ github.run_id }}
          path: ev-charge-portugal-github-ready/tmp/web-rollback/
          retention-days: 7
      - name: Deploy static Worker with D1 + KV
        id: deploy
        working-directory: ev-charge-portugal-github-ready
        run: wrangler deploy --config wrangler-deploy.toml
      - name: Verify deployed static site and national snapshot
        run: |
          set -euo pipefail
          expected="$(grep -o 'chargevoy.js?v=[0-9]*' ev-charge-portugal-github-ready/index.html | head -1)"
          for attempt in 1 2 3 4 5 6 7 8; do
            page="$(curl --silent --show-error --max-time 20 'https://broken-mud-373e.zombid.workers.dev/' || true)"
            code="$(curl --silent --show-error --max-time 30 -o /tmp/site-snapshot.json -w '%{http_code}' 'https://broken-mud-373e.zombid.workers.dev/assets/stations-snapshot.json' || true)"
            if [ "$code" = 200 ] && echo "$page" | grep -Fq "$expected" && node -e 'const fs=require("fs"),crypto=require("crypto");const bytes=fs.readFileSync("/tmp/site-snapshot.json");const expected=require("./ev-charge-portugal-github-ready/assets/stations-manifest.json");if(bytes.length!==expected.bytes||crypto.createHash("sha256").update(bytes).digest("hex")!==expected.sha256)process.exit(1)'; then
              for legal_page in privacy.html account-deletion.html; do
                curl --fail --silent --show-error --max-time 20 "https://broken-mud-373e.zombid.workers.dev/$legal_page" > "/tmp/$legal_page"
                cmp "ev-charge-portugal-github-ready/$legal_page" "/tmp/$legal_page"
              done
              echo "Static site, legal pages and national catalogue verified"
              exit 0
            fi
            echo "Attempt $attempt: static asset HTTP $code; waiting for deployment propagation"
            sleep 10
          done
          echo "::error::Static site validation failed; roll back the Worker deployment to the previous version"
          exit 1
      - name: Restore previous web Worker on failed verification
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        working-directory: ev-charge-portugal-github-ready
        run: wrangler rollback "${{ steps.backup.outputs.version }}" --config wrangler-deploy.toml --message "Automated rollback after failed static site verification"

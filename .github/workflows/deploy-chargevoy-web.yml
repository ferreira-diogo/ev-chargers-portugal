name: Deploy ChargeVoy web

on:
  workflow_dispatch:
  push:
    branches: [main, fix/d1-api-verification-retry]
    paths:
      - "ev-charge-portugal-github-ready/index.html"
      - "ev-charge-portugal-github-ready/assets/**"
      - "ev-charge-portugal-github-ready/manifest.webmanifest"
      - "ev-charge-portugal-github-ready/service-worker.js"
      - "ev-charge-portugal-github-ready/icon.svg"
      - "ev-charge-portugal-github-ready/scripts/build-web.mjs"
      - "ev-charge-portugal-github-ready/scripts/import-nap-datex.mjs"
      - "ev-charge-portugal-github-ready/wrangler.toml"
      - "ev-charge-portugal-github-ready/worker/**"
      - ".github/workflows/deploy-chargevoy-web.yml"

concurrency:
  group: chargevoy-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate Cloudflare configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$D1_DATABASE_NAME" || test -n "$D1_DATABASE_ID" || { echo "::error::Missing D1 database configuration"; exit 1; }
      - name: Build web bundle
        working-directory: ev-charge-portugal-github-ready
        run: |
          npm install --no-audit --no-fund
          npm test
          node scripts/import-nap-datex.mjs --web-snapshot
          node scripts/verify-static-snapshot.mjs
          npm run build:web
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Resolve D1 and availability KV
        working-directory: ev-charge-portugal-github-ready
        run: |
          set -euo pipefail
          if [ -n "$D1_DATABASE_ID" ]; then
            DB_ID="$D1_DATABASE_ID"
          else
            wrangler d1 info "$D1_DATABASE_NAME" --json > /tmp/d1-info.json
            DB_ID="$(node -e 'const fs=require("fs");const root=JSON.parse(fs.readFileSync("/tmp/d1-info.json","utf8"));const c=[root,root.result,root.database,root.result?.database].filter(Boolean);const d=c.find(x=>x.uuid||x.database_id||x.id);if(!d)process.exit(2);process.stdout.write(d.uuid||d.database_id||d.id||"")')"
          fi
          test -n "$DB_ID" || { echo "::error::D1 database ID could not be resolved"; exit 1; }
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error -H "$AUTH" "$API?per_page=100" > /tmp/kv.json
          KV_ID="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/kv.json","utf8"));const n=(x.result||[]).find(v=>v.title==="chargevoy-availability");if(!n?.id)process.exit(2);process.stdout.write(n.id)')"
          test -n "$KV_ID" || { echo "::error::KV namespace chargevoy-availability could not be resolved"; exit 1; }
          cp wrangler.toml wrangler-deploy.toml
          DB_ID="$DB_ID" KV_ID="$KV_ID" node - <<'NODE'
          const fs=require('fs'); const file='wrangler-deploy.toml';
          let text=fs.readFileSync(file,'utf8');
          text += `\n[[d1_databases]]\nbinding = "CHARGEVOY_DB"\ndatabase_name = "${process.env.D1_DATABASE_NAME || 'chargevoy-fallback'}"\ndatabase_id = "${process.env.DB_ID}"\n`;
          text += `\n[[kv_namespaces]]\nbinding = "AVAILABILITY_KV"\nid = "${process.env.KV_ID}"\n`;
          fs.writeFileSync(file,text);
          NODE
          grep -q '^database_id = "' wrangler-deploy.toml
          grep -q '^id = "' wrangler-deploy.toml
          ! grep -q 'PLACEHOLDER' wrangler-deploy.toml
      - name: Deploy static Worker with D1 + KV
        id: deploy
        working-directory: ev-charge-portugal-github-ready
        run: wrangler deploy --config wrangler-deploy.toml
      - name: Verify deployed static site and national snapshot
        run: |
          set -euo pipefail
          expected="$(grep -o 'chargevoy.js?v=[0-9]*' ev-charge-portugal-github-ready/index.html | head -1)"
          for attempt in 1 2 3 4 5 6 7 8; do
            page="$(curl --silent --show-error --max-time 20 'https://broken-mud-373e.zombid.workers.dev/' || true)"
            code="$(curl --silent --show-error --max-time 30 -o /tmp/site-snapshot.json -w '%{http_code}' 'https://broken-mud-373e.zombid.workers.dev/assets/stations-snapshot.json' || true)"
            if [ "$code" = 200 ] && echo "$page" | grep -Fq "$expected" && node -e 'const x=require("/tmp/site-snapshot.json");if(x.stations?.length<8000||x.connectors?.length<15000)process.exit(1)'; then
              echo "Static site and national catalogue available without a D1 query"
              exit 0
            fi
            echo "Attempt $attempt: static asset HTTP $code; waiting for deployment propagation"
            sleep 10
          done
          echo "::error::Static site validation failed; roll back the Worker deployment to the previous version"
          exit 1
      - name: Restore previous web Worker on failed verification
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        working-directory: ev-charge-portugal-github-ready
        run: wrangler rollback --config wrangler-deploy.toml --message "Automated rollback after failed static site verification"

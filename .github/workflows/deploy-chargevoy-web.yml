name: Deploy ChargeVoy web

on:
  workflow_dispatch:
  push:
    paths:
      - "ev-charge-portugal-github-ready/index.html"
      - "ev-charge-portugal-github-ready/assets/**"
      - "ev-charge-portugal-github-ready/manifest.webmanifest"
      - "ev-charge-portugal-github-ready/service-worker.js"
      - "ev-charge-portugal-github-ready/icon.svg"
      - "ev-charge-portugal-github-ready/scripts/build-web.mjs"
      - "ev-charge-portugal-github-ready/wrangler.toml"
      - ".github/workflows/deploy-chargevoy-web.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate Cloudflare configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Build web bundle
        working-directory: ev-charge-portugal-github-ready
        run: npm run build:web
      - name: Deploy static Worker
        working-directory: ev-charge-portugal-github-ready
        run: npx wrangler@4 deploy --config wrangler.toml

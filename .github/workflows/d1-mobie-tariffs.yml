name: D1 MOBI.E tariff sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ev-charge-portugal-github-ready/scripts/import-mobie-tariffs.py'
      - '.github/workflows/d1-mobie-tariffs.yml'
  schedule:
    - cron: "43 5 * * *"

concurrency:
  group: chargevoy-d1-writes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
    defaults:
      run:
        working-directory: ev-charge-portugal-github-ready
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$D1_DATABASE_NAME"
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Prepare verified tariff batches
        run: python3 scripts/import-mobie-tariffs.py
      - name: Back up current verified tariffs
        run: |
          mkdir -p tmp/tariff-rollback
          wrangler d1 export "$D1_DATABASE_NAME" --remote --table official_opc_tariffs --output tmp/tariff-rollback/official_opc_tariffs.sql
      - uses: actions/upload-artifact@v4
        with:
          name: tariff-rollback-${{ github.run_id }}
          path: ev-charge-portugal-github-ready/tmp/tariff-rollback/
          retention-days: 30
      - name: Import tariffs incrementally
        run: |
          set -e
          for file in tmp/d1-tariffs/*.sql; do
            success=0
            for attempt in 1 2 3; do
              if wrangler d1 execute "$D1_DATABASE_NAME" --remote --file="$file"; then
                success=1
                break
              fi
              sleep $((attempt * 5))
            done
            test "$success" = 1 || exit 1
          done
      - name: Verify price coverage
        run: |
          wrangler d1 execute "$D1_DATABASE_NAME" --remote --json --command="SELECT count(*) AS tariff_count, count(DISTINCT t.station_id) AS station_count FROM official_opc_tariffs t JOIN station_cache_v2 s ON s.id=t.station_id WHERE t.updated_at > datetime('now','-2 days')" > /tmp/tariff-counts.json
          python3 - <<'PY'
          import json
          result = json.load(open('/tmp/tariff-counts.json'))
          row = result[0]['results'][0]
          print(row)
          if row['tariff_count'] < 8000 or row['station_count'] < 5000:
              raise SystemExit('D1 tariff coverage below safety threshold')
          PY

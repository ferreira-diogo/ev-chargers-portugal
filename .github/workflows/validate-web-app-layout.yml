name: Validate website app layout
on:
  push:
    branches: [feature/web-app-layout-20261012]
  pull_request:
    paths:
      - 'ev-charge-portugal-github-ready/**'
      - '.github/workflows/validate-web-app-layout.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ev-charge-portugal-github-ready
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Identify changes to the tariff importer
        id: tariffs
        run: |
          if git diff --name-only HEAD^ HEAD -- scripts/import-mobie-tariffs.py | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # UI-only work does not re-import the remote national CSV. Importer changes
      # still exercise the live source and its unchanged resource/safety limits.
      - name: Validate current official tariff CSV without database writes
        if: steps.tariffs.outputs.changed == 'true' 
        run: python3 scripts/import-mobie-tariffs.py --out tmp/tariff-validation
      - run: npm test
      - run: node --test scripts/pricing-context.test.mjs
      - run: npm run build:web
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Verify public interface and account flows
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node scripts/browser-app-layout.mjs
          node scripts/browser-account-login.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-app-layout-qa
          path: ev-charge-portugal-github-ready/scripts/qa/*.png

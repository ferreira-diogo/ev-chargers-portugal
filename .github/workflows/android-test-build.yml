name: Android test build

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/chargevoy-android/**'
      - '!apps/chargevoy-android/account-worker/**'
      - '.github/workflows/android-test-build.yml'

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.paths.outputs.android }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: paths
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const {execFileSync}=require('node:child_process');
          const before=process.env.BEFORE;
          let android=true;
          if(process.env.GITHUB_EVENT_NAME==='push' && /^[a-f0-9]{40}$/.test(before||'') && !/^0+$/.test(before)){
            const paths=execFileSync('git',['diff','--name-only',before,'HEAD'],{encoding:'utf8'}).trim().split('\n');
            android=paths.some(p=>p.startsWith('apps/chargevoy-android/')&&!p.startsWith('apps/chargevoy-android/account-worker/'));
          }
          console.log('android='+android);
          NODE
  build:
    needs: scope
    if: needs.scope.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_INCLUDE_CATALOGUE: "1"
    defaults:
      run:
        working-directory: apps/chargevoy-android
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/chargevoy-android/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Verify mobile and tablet UI
        run: node browser-test.mjs
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug bundleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ev-charge-portugal-android-test
          path: |
            apps/chargevoy-android/android/app/build/outputs/apk/debug/app-debug.apk
            apps/chargevoy-android/android/app/build/outputs/bundle/debug/app-debug.aab
            apps/chargevoy-android/qa/*.png
          if-no-files-found: error
          retention-days: 14

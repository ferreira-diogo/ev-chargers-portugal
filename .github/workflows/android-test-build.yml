name: Android test build

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/chargevoy-android/**'
      - '.github/workflows/android-test-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_INCLUDE_CATALOGUE: "1"
    defaults:
      run:
        working-directory: apps/chargevoy-android
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/chargevoy-android/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Verify mobile and tablet UI
        run: node browser-test.mjs
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug bundleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ev-charge-portugal-android-test
          path: |
            apps/chargevoy-android/android/app/build/outputs/apk/debug/app-debug.apk
            apps/chargevoy-android/android/app/build/outputs/bundle/debug/app-debug.aab
            apps/chargevoy-android/qa/*.png
          if-no-files-found: error
          retention-days: 14

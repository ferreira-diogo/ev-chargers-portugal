name: Validate live map

on:
  pull_request:
    paths:
      - "ev-charge-portugal-github-ready/assets/**"
      - "ev-charge-portugal-github-ready/worker/**"
      - "ev-charge-portugal-github-ready/worker-api/**"
      - "ev-charge-portugal-github-ready/service-worker.js"
      - "ev-charge-portugal-github-ready/scripts/verify-*.mjs"
      - "ev-charge-portugal-github-ready/scripts/import-nap-datex.mjs"
      - "ev-charge-portugal-github-ready/scripts/build-web.mjs"
      - "ev-charge-portugal-github-ready/wrangler.toml"
      - "ev-charge-portugal-github-ready/index.html"
      - ".github/workflows/deploy-chargevoy-web.yml"
      - "ev-charge-portugal-github-ready/package.json"
      - ".github/workflows/validate-live-map.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: ev-charge-portugal-github-ready
        run: npm ci --ignore-scripts
      - name: Regression tests
        working-directory: ev-charge-portugal-github-ready
        run: npm test
      - name: Build and validate national snapshot and Cloudflare bundle
        working-directory: ev-charge-portugal-github-ready
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$(node scripts/is-presentation-only.mjs "$BASE_SHA")" = true ]; then
            curl --fail --silent --show-error --retry 3 --max-time 45 https://broken-mud-373e.zombid.workers.dev/assets/stations-snapshot.json > assets/stations-snapshot.json
          else
            mkdir -p tmp
            curl --fail --silent --show-error --retry 3 --max-time 45 'https://broken-mud-373e.zombid.workers.dev/assets/stations-snapshot.json' > tmp/previous-stations.json
            NAP_PREVIOUS_SNAPSHOT=tmp/previous-stations.json node scripts/import-nap-datex.mjs --web-snapshot
          fi
          node scripts/verify-static-snapshot.mjs
          npm run build:web
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/chargevoy-wrangler-dry-run --config wrangler.toml

      - name: Upload NAP quarantine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nap-web-quarantine
          path: ev-charge-portugal-github-ready/tmp/nap-quarantine.json
          if-no-files-found: ignore

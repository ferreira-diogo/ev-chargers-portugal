name: Deploy ChargeVoy API Worker

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy ChargeVoy web"]
    types: [completed]
  push:
    paths:
      - "ev-charge-portugal-github-ready/worker-api/index.js"
      - "ev-charge-portugal-github-ready/wrangler-api.toml"
      - ".github/workflows/deploy-chargevoy-api.yml"

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate Cloudflare configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$D1_DATABASE_NAME" || { echo "::error::Missing D1_DATABASE_NAME"; exit 1; }
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Resolve D1 database ID
        working-directory: ev-charge-portugal-github-ready
        run: |
          if [ -n "$D1_DATABASE_ID" ]; then
            DB_ID="$D1_DATABASE_ID"
          else
            wrangler d1 info "$D1_DATABASE_NAME" --json > /tmp/d1-info.json
            DB_ID="$(node -e 'const fs=require("fs");const root=JSON.parse(fs.readFileSync("/tmp/d1-info.json","utf8"));const candidates=[root,root.result,root.database,root.result?.database].filter(Boolean);const d=candidates.find(x=>x.uuid||x.database_id||x.id);if(!d) process.exit(2);process.stdout.write(d.uuid||d.database_id||d.id||"")')"
          fi
          test -n "$DB_ID" || { echo "::error::D1 database ID could not be resolved; add D1_DATABASE_ID"; exit 1; }
          cp wrangler-api.toml wrangler-api-deploy.toml
          node - <<'NODE'
          const fs = require("fs");
          const file = "wrangler-api-deploy.toml";
          const dbId = process.env.D1_DATABASE_ID || process.env.DB_ID;
          if (!dbId) {
            console.error("D1 database ID is empty");
            process.exit(1);
          }
          let text = fs.readFileSync(file, "utf8");
          text = text.replace(
            /# database_id = "ID_DA_BASE_D1"/,
            `database_id = "${dbId}"`,
          );
          fs.writeFileSync(file, text);
          NODE
          grep -q '^database_id = "' wrangler-api-deploy.toml
      - name: Deploy API Worker
        working-directory: ev-charge-portugal-github-ready
        run: wrangler deploy --config wrangler-api-deploy.toml
      - name: Verify public API endpoint
        env:
          API_HEALTH_URL: https://chargevoy-api.zombid.workers.dev/api/catalog?table=vehicle_models
        run: |
          set -e
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --max-time 15 --output /tmp/chargevoy-api.json --write-out '%{http_code}' "$API_HEALTH_URL" || true)"
            if [ "$status" = "200" ] && grep -q '"rows"' /tmp/chargevoy-api.json; then
              echo "ChargeVoy API is serving D1 JSON (HTTP $status)"
              exit 0
            fi
            echo "API check attempt $attempt returned HTTP $status; waiting for propagation"
            sleep 5
          done
          echo "::error::Public API endpoint is not serving the deployed API Worker"
          sed -n '1,20p' /tmp/chargevoy-api.json || true
          exit 1

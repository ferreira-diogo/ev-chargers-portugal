name: D1 OpenStreetMap station sync

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/d1-osm-sync.yml"
      - "ev-charge-portugal-github-ready/scripts/sync-d1-openstreetmap.mjs"
  schedule:
    - cron: "30 */6 * * *"

jobs:
  sync:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.D1_DATABASE_NAME != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
    defaults:
      run:
        working-directory: ev-charge-portugal-github-ready
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Ensure D1 schema
        run: wrangler d1 execute "$D1_DATABASE_NAME" --remote --file=cloudflare/d1/schema.sql
      - name: Download and prepare OpenStreetMap snapshot
        run: node scripts/sync-d1-openstreetmap.mjs
      - name: Upload snapshot to D1
        run: |
          for file in tmp/d1-osm-sync/*.sql; do
            wrangler d1 execute "$D1_DATABASE_NAME" --remote --file="$file"
          done

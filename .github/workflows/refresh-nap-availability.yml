name: Refresh NAP availability snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-nap-availability.yml"
      - "ev-charge-portugal-github-ready/scripts/refresh-nap-availability-kv.mjs"
  schedule:
    - cron: "3,18,33,48 * * * *"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ev-charge-portugal-github-ready/package-lock.json
      - name: Refresh the verified NAP snapshot
        working-directory: ev-charge-portugal-github-ready
        run: |
          npm ci --ignore-scripts
          node scripts/refresh-nap-availability-kv.mjs

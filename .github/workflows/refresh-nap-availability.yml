name: Refresh NAP availability snapshot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/refresh-nap-availability.yml"
      - "ev-charge-portugal-github-ready/scripts/refresh-nap-availability-kv*.mjs"
      - "ev-charge-portugal-github-ready/scripts/import-nap-availability*.mjs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-nap-availability.yml"
      - "ev-charge-portugal-github-ready/scripts/refresh-nap-availability-kv.mjs"
      - "ev-charge-portugal-github-ready/scripts/refresh-nap-availability-kv.test.mjs"
      - "ev-charge-portugal-github-ready/scripts/import-nap-availability*.mjs"
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('nap-availability-kv-test-{0}', github.event.pull_request.number) || 'nap-availability-kv-refresh' }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ev-charge-portugal-github-ready/package-lock.json
      - name: Install dependencies
        working-directory: ev-charge-portugal-github-ready
        run: npm ci --ignore-scripts
      - name: Test feed validation and safe retries
        working-directory: ev-charge-portugal-github-ready
        run: node --test scripts/import-nap-availability.test.mjs scripts/refresh-nap-availability-kv.test.mjs
      - name: Refresh the verified NAP snapshot
        if: github.event_name != 'pull_request'
        working-directory: ev-charge-portugal-github-ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/refresh-nap-availability-kv.mjs

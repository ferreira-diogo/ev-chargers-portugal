name: D1 station fallback sync

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/d1-stations-sync.yml"
      - "ev-charge-portugal-github-ready/scripts/sync-d1-stations.mjs"
      - "ev-charge-portugal-github-ready/cloudflare/d1/schema.sql"
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: d1-station-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
    defaults:
      run:
        working-directory: ev-charge-portugal-github-ready
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Cloudflare configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$D1_DATABASE_NAME" || { echo "::error::Missing D1_DATABASE_NAME"; exit 1; }
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Ensure D1 schema
        run: wrangler d1 execute "$D1_DATABASE_NAME" --remote --file=cloudflare/d1/schema.sql
      - name: Prepare station snapshot
        run: node scripts/sync-d1-stations.mjs
      - name: Upload station snapshot
        run: |
          for attempt in 1 2 3 4 5; do
            echo "D1 upload attempt $attempt"
            failed=0
            if ! wrangler d1 execute "$D1_DATABASE_NAME" --remote --file=tmp/d1-sync/001_prepare.sql; then
              failed=1
            fi
            if [ "$failed" -eq 0 ]; then
              for file in tmp/d1-sync/0*.sql; do
                [ "$file" = "tmp/d1-sync/001_prepare.sql" ] && continue
                if ! wrangler d1 execute "$D1_DATABASE_NAME" --remote --file="$file"; then
                  failed=1
                  break
                fi
              done
            fi
            if [ "$failed" -eq 0 ]; then
              echo "D1 station snapshot uploaded"
              exit 0
            fi
            echo "D1 upload attempt $attempt failed; retrying after a short pause"
            sleep $((attempt * 10))
          done
          echo "::error::D1 station snapshot upload failed after retries"
          exit 1

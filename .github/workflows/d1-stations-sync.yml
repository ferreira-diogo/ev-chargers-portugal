name: D1 station fallback sync

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/d1-stations-sync.yml"
      - "ev-charge-portugal-github-ready/scripts/import-nap-datex.mjs"
      - "ev-charge-portugal-github-ready/scripts/build-nap-d1-mapping.mjs"
      - "ev-charge-portugal-github-ready/scripts/optimize-d1-nap-sql.mjs"
      - "ev-charge-portugal-github-ready/cloudflare/d1/schema.sql"
  schedule:
    # Structural catalogue only. Live availability is refreshed separately in KV.
    - cron: "17 3 * * *"

concurrency:
  group: d1-station-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
    defaults:
      run:
        working-directory: ev-charge-portugal-github-ready
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Cloudflare configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$D1_DATABASE_NAME" || { echo "::error::Missing D1_DATABASE_NAME"; exit 1; }
      - name: Install Wrangler
        run: npm install --global wrangler@4
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Ensure D1 schema
        run: wrangler d1 execute "$D1_DATABASE_NAME" --remote --file=cloudflare/d1/schema.sql
      - name: Prepare NAP station snapshot
        run: node scripts/import-nap-datex.mjs --d1
      - name: Prepare explicit NAP live mapping
        run: node scripts/build-nap-d1-mapping.mjs
      - name: Convert snapshot to incremental D1 writes
        run: node scripts/optimize-d1-nap-sql.mjs
      - name: Estimate D1 write ceiling
        run: |
          set -e
          stations=$(grep -Rho "('nap-" tmp/d1-nap-sync/*station_cache_v2.sql 2>/dev/null | wc -l || true)
          connectors=$(grep -Rho "('nap-" tmp/d1-nap-sync/*connectors.sql 2>/dev/null | wc -l || true)
          mappings=$(grep -Rho "('" tmp/d1-nap-sync/0001_nap_mapping.sql 2>/dev/null | wc -l || true)
          ceiling=$((stations + connectors + mappings))
          echo "Maximum candidate rows: $ceiling (stations=$stations connectors=$connectors mappings=$mappings)"
          echo "Unchanged existing rows use conditional UPSERT/IGNORE and therefore do not execute an UPDATE."
          if [ "$ceiling" -gt 95000 ]; then
            echo "::error::Refusing D1 sync: candidate write ceiling $ceiling exceeds 95,000-row safety budget"
            exit 1
          fi
      - name: Guard against destructive full refresh
        run: |
          set -e
          ! grep -R "DELETE FROM station_cache\|DELETE FROM station_cache_v2\|DELETE FROM connectors\|DELETE FROM nap_connector_mapping" tmp/d1-nap-sync/*.sql
          ! ls tmp/d1-nap-sync/*_station_cache.sql >/dev/null 2>&1
      - name: Group NAP snapshot batches
        run: |
          set -e
          rm -rf tmp/d1-nap-upload
          mkdir -p tmp/d1-nap-upload
          group=1
          count=0
          for file in tmp/d1-nap-sync/*.sql; do
            case "$file" in
              *999_validate.sql) continue ;;
            esac
            cat "$file" >> "tmp/d1-nap-upload/$(printf '%04d' "$group").sql"
            count=$((count + 1))
            if [ "$count" -ge 10 ]; then
              group=$((group + 1))
              count=0
            fi
          done
      - name: Upload grouped incremental NAP catalogue
        run: |
          set -e
          for file in tmp/d1-nap-upload/*.sql; do
            echo "Uploading $file"
            success=0
            for attempt in 1 2 3; do
              if wrangler d1 execute "$D1_DATABASE_NAME" --remote --file="$file"; then
                success=1
                break
              fi
              echo "Upload failed (attempt $attempt); retrying current batch..."
              sleep $((attempt * 5))
            done
            test "$success" = "1" || exit 1
          done
      - name: Verify D1 NAP mapping
        run: |
          result="$(wrangler d1 execute "$D1_DATABASE_NAME" --remote --command="SELECT count(*) AS mapping_count FROM nap_connector_mapping")"
          echo "$result"
          echo "$result" | grep -q 'mapping_count'
      - name: Verify D1 station API
        run: |
          curl --fail --silent --show-error --max-time 30 "https://chargevoy-api.zombid.workers.dev/api/stations?lat=39.7&lon=-8.1" | grep -q '"stations"'

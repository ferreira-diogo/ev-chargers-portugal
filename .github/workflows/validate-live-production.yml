name: Validate production live availability

on:
  workflow_dispatch:
  schedule:
    - cron: "13,43 * * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ev-charge-portugal-github-ready/package-lock.json
      - name: Install dependencies
        working-directory: ev-charge-portugal-github-ready
        run: npm ci --ignore-scripts
      - name: Verify deployed static map and KV publication
        working-directory: ev-charge-portugal-github-ready
        run: node scripts/verify-live-snapshot.mjs

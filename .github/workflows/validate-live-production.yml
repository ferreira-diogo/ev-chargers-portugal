name: Validate production live availability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ev-charge-portugal-github-ready/worker-api/**"
      - "ev-charge-portugal-github-ready/scripts/import-nap-availability.mjs"
      - "ev-charge-portugal-github-ready/scripts/refresh-nap-availability-kv.mjs"
      - "ev-charge-portugal-github-ready/scripts/verify-live-snapshot.mjs"
      - ".github/workflows/validate-live-production.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ev-charge-portugal-github-ready/package-lock.json
      - name: Install dependencies
        working-directory: ev-charge-portugal-github-ready
        run: npm ci --ignore-scripts
      - name: Validate current official NAP XML
        working-directory: ev-charge-portugal-github-ready
        run: node scripts/import-nap-availability.mjs
      - name: Run application regression tests
        working-directory: ev-charge-portugal-github-ready
        run: npm test
      - name: Verify deployed D1 + KV live merge
        working-directory: ev-charge-portugal-github-ready
        run: node scripts/verify-live-snapshot.mjs

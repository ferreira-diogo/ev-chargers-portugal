name: Validate production live availability

on:
  workflow_dispatch:
  schedule:
    - cron: "13,43 * * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify availability snapshot through authenticated Cloudflare API
        working-directory: ev-charge-portugal-github-ready
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AVAILABILITY_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_AVAILABILITY_KV_NAMESPACE_ID }}
          CLOUDFLARE_KV_READ_TOKEN: ${{ secrets.CLOUDFLARE_KV_READ_TOKEN }}
        run: node scripts/verify-kv-publication.mjs

name: Validate live map production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy ChargeVoy web"]
    types: [completed]

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate public site, catalogue and KV source
        working-directory: ev-charge-portugal-github-ready
        run: node scripts/verify-live-snapshot.mjs

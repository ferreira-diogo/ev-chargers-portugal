name: Read-only station grouping audit
on:
  push:
    branches: ['audit/vila-real-connectors-20261005']
    paths: ['.github/workflows/audit-station-grouping.yml', 'diagnostics/station-grouping-audit.mjs']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Audit published national catalogue and official source without database writes
        run: node diagnostics/station-grouping-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: station-grouping-read-only-audit
          path: station-grouping-audit.json
          retention-days: 14

name = "chargevoy-api"
main = "worker-api/index.js"
compatibility_date = "2026-09-25"
keep_vars = true

[triggers]
crons = ["*/5 * * * *"]

[secrets]
required = ["GITHUB_ACTIONS_TOKEN"]

[[d1_databases]]
binding = "CHARGEVOY_DB"
database_name = "chargevoy-fallback"
# database_id = "ID_DA_BASE_D1"

[[kv_namespaces]]
binding = "AVAILABILITY_KV"
# id = "ID_DO_KV_AVAILABILITY"
